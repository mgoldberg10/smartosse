# Site-keyed path configuration for smartosse.paths (ROADMAP.md §4/§4b).
#
# Detection is a convenience, never the only way in: SMARTOSSE_SITE and any
# SMARTOSSE_<KEY> environment variable always win over what's in this file
# (see smartosse/paths.py). A new machine is therefore a one-line env-var
# export, not a required code or config change.
#
# Every key here is optional. In particular `run_root` (Tier 1: regenerating
# caches from run output) is expected to be ABSENT for a site like `docker`
# that only ever works from shipped caches (Tier 0) -- code that assumes
# run_root exists is code that cannot run at Tier 0, which is the bug this
# file exists to prevent.

sites:
  pfe:
    # NASA Advanced Supercomputing. Confirmed: login nodes are pfeNN
    # (this file was written from pfe20). Compute-node naming CONFIRMED
    # 2026-09-24: PBS job 25186085 was placed on `r141i0n26`, which the
    # `r*i*n*` glob below matches -- so detection resolves to this site on a
    # compute node as well as on a login node. That pattern was previously an
    # unverified carry-over from a planning pass; it is now observed. Note the
    # analysis job (jobs/pfe_gen_gate_caches.pbs) still exports SMARTOSSE_SITE
    # explicitly, since an env var beating detection is the documented contract
    # and a job should not depend on a glob.
    detect:
      hostname: ["pfe*", "r*i*n*"]
    run_root: /nobackupp27/mgoldbe1/aste_270x450x180/osses
    # CONFIRMED, 2026-09-24: opened via smartosse.dataset.open_astedataset +
    # smartosse.llc_grid.get_llc_grid against this exact path and got the
    # expected 270x270x50x6-tile ASTE dims and a valid xgcm.Grid -- this was
    # a guess when first written (picked because it matches the active
    # code_froman family), now it's verified. GRID_noblank/ (the other
    # candidate, roughly half GRID_froman/'s AngleCS.data size) was never
    # tried; no reason to now that this one is known to work. Note the kept
    # model/jobs/ scripts don't actually use this -- they symlink raw
    # *.mitgrid tiles from an external run_template
    # (/nobackupp17/atnguye4/llc270/aste_270x450x180/run_template/
    # input_binaries/) instead, so this is the smartosse-analysis-side grid
    # source, not necessarily what a from-scratch run would use.
    grid_dir: /nobackupp27/mgoldbe1/aste_270x450x180/GRID_froman
    # Not established -- pfe-side extraction (gen_*.py) hasn't been run yet
    # (ROADMAP §4b), so there's no cache_dir convention here yet. Falls back
    # to the shipped smartosse/figures/data/ (repo-relative) if unset.
    #
    # NATURE RUN, located on pfe 2026-09-24 (Matt). These are three separate
    # products under one llc_4320/aste/ tree, not one directory -- hence three
    # keys. Verified by opening each and checking the variable names the
    # smartosse.osse.NatureRun loaders actually ask for:
    #   nr_dir         -> PhiBot, face-separated (faces 00-12, t0/t1),
    #                     hourly 2011-09-13 .. 2012-11-15 (10312 steps).
    #                     `NatureRun(fld_type='bp')` globs '*face{NN}*' here and
    #                     concatenates aste_tiles = [1,2,6,7,10,11].
    #   nr_bt_dir      -> U_bt.nc / V_bt.nc, daily, 2012-01-01 .. 2012-01-31,
    #                     already ASTE-tiled (tile=6). `fld_type='bt'`.
    #   nr_fwflux_dir  -> ADVen_FW_sumk.nc (ADVe_FW + ADVn_FW), daily January
    #                     2012, tile=13 (all faces; the loader isel's aste_tiles).
    # NOTE the bp archive stops 2012-11-15, so it does NOT cover a full 2012.
    # fig8's `complete_months_only=True` (Jan-Oct 2012) is inside that; its
    # `--all-months` variant is not.
    nr_dir: /nobackupp27/mgoldbe1/llc_4320/aste/global_bp/hourly/postprocess
    nr_bt_dir: /nobackupp27/mgoldbe1/llc_4320/aste/barotropic_velocity/201201
    nr_fwflux_dir: /nobackupp27/mgoldbe1/llc_4320/aste/fwflux
    #
    # Atmospheric reanalysis archives for the p_atm uncertainty fields
    # (gen_patm_uncertainty_fields). load_forcing_generic looks for
    # '<dataset>_<fld>_<year>' inside these, e.g. 'jra55_pres_2012'.
    #   jra55_dir  -> jra55_pres_2012 present (2.4 GB), own space. VERIFIED.
    #   jra3q_dir  -> jra3q_pres_2012 present (16 GB). NOTE: this is another
    #                 user's directory (atnguye4), world-readable as of
    #                 2026-09-24 but not under our control -- if it vanishes,
    #                 the spread field is the only thing that breaks.
    # DELIBERATELY ABSENT: era5_dir. There is NO ERA5 surface pressure on NAS
    # that we can read -- atnguye4/era5 holds only rain and tmp2m_degC, and
    # dbwhitt/era5 is permission-denied. So `sigma_patm_spread` cannot be
    # rebuilt on pfe; omitting the key makes paths.era5_dir() raise the
    # actionable PathNotConfiguredError instead of silently reading nothing.
    jra55_dir: /nobackupp27/mgoldbe1/jra55
    jra3q_dir: /nobackupp17/atnguye4/jra3q

  tacc:
    # TACC (Lonestar6/Stampede3), reached via the shared Stockyard
    # filesystem -- paths say "ls6" regardless of which TACC system you're
    # actually logged into, because /work2 is mounted across all of them
    # and isn't purged (see ROADMAP.md §4b). /scratch, by contrast, IS
    # purged and is Stampede3-local -- see the run_root note below.
    detect:
      hostname: ["*.stampede3.tacc.utexas.edu", "*.ls6.tacc.utexas.edu"]
    # Purgeable, Tier 1 only -- this is a periodic copy of pfe's run_root
    # (the system of record), not the original. See ROADMAP.md §4b.
    run_root: /scratch/08381/goldberg/aste_270x450x180/osses
    grid_dir: /work/08381/goldberg/ls6/aste_270x450x180/GRID_noblank_real4
    nr_dir: /work/08381/goldberg/ls6/aste_270x450x180/run_template/input_ecco/smart_phibot/phibot_daily
    basin_dir: /work/08381/goldberg/ls6/aste_270x450x180/run_template/input_basin
    cache_dir: /work2/08381/goldberg/ls6/smartosse/smartosse/figures/data

  docker:
    # Tier 0 only, deliberately: no run_root, no grid_dir, no nr_dir. Code
    # that only reads from cache_dir works here; code that assumes any of
    # the others exist needs Tier 1/2 inputs this site can't provide.
    cache_dir: /data

  # Template for a contributor's own machine / a laptop. Uncomment and fill
  # in to work from local copies of the small pieces (Tier 0 caches, or a
  # personal copy of the grid) without editing any tracked file.
  # local:
  #   cache_dir: /path/to/your/smartosse/figures/data
  #   grid_dir: /path/to/your/copy/of/GRID_noblank_real4
