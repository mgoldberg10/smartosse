[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "smartosse"
version = "0.1.0"
description = "SMART Cable data assimilation and OSSE analysis utilities"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Matthew Goldberg", email = "matthew.goldberg10@utexas.edu" },
]
requires-python = ">=3.9"

# Kept deliberately light -- these are what smartosse.bp / .utils / .dataset
# (the data-extraction path) actually import. The plotting stack
# (cartopy, matplotlib, cmocean, pyresample, ecco_v4_py) is NOT listed here:
# smartosse/__init__.py resolves submodules lazily (PEP 562), so a bare
# `pip install smartosse` + `from smartosse.bp import BPReader` needs none of
# it -- see smartosse/__init__.py's own docstring and environment-extract.yml.
# Anyone using the plotting modules (smartosse.plot, smartosse.osse, figures/)
# needs the `plotting` extra below, or environment.yml for the full stack.
dependencies = [
    "numpy",
    "scipy",
    "xarray",
    "xmitgcm",
    "tabulate",
    "pyyaml",
]

[project.optional-dependencies]
plotting = [
    "matplotlib",
    "cartopy",
    "cmocean",
    "pyresample",
    "ecco_v4_py",
    "xgcm",
]
dev = [
    "pytest>=2.8",
    "flake8",
]

[project.scripts]
# The figure driver (ROADMAP.md section 5). `python -m smartosse.figures` works
# without this; the console script is just the friendlier spelling.
smartosse-figures = "smartosse.figures.__main__:main"

[tool.setuptools.packages.find]
include = ["smartosse*"]

[tool.setuptools.package-data]
# MANIFEST.yml is data the driver reads at runtime, so it has to travel with the
# package -- setuptools ships .py only unless told otherwise, and an installed
# wheel without it makes `smartosse-figures` fail on a missing manifest.
"smartosse.figures" = [
    "MANIFEST.yml",
    # Fig. 1's global cable coordinates -- small, static, not regenerable from
    # anything in the repo. See smartosse/figures/cable_data/README.md.
    "cable_data/*.csv",
    "cable_data/partial_cable_coords/*.csv",
    "cable_data/README.md",
]
