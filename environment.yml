# Full environment: analysis + plotting (TACC / Docker / a laptop). For the
# extraction-only subset (pfe, no cartopy/matplotlib), see environment-extract.yml.
name: smartosse
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - numpy
  - pandas
  - flake8
  - pytest
  - scipy
  - matplotlib
  - xarray
  - xmitgcm
  - xgcm
  - cartopy
  - cmocean
  - pyresample
  - tabulate
  - pyyaml
  - ecco_v4_py
